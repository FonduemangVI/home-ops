---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  chartRef:
    kind: OCIRepository
    name: csi-driver-nfs
  interval: 1h
  values:
    externalSnapshotter:
      enabled: false
    storageClass:
      create: true
      name: nfs-syno
      parameters:
        server: 192.168.30.31
        share: /volume1/k8snfs
        # Readable per-PVC folders on the NAS (expanded by the CSI driver)
        subDir: ${pvc.metadata.namespace}-${pvc.metadata.name}
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      mountOptions:
        - nfsvers=4.1
        - hard
        - noatime
