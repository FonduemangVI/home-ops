---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  interval: 1h
  values:
    externalSnapshotter:
      enabled: false
    storageClass:
      create: true
      name: nfs-syno
      parameters:
        server: 192.168.30.31
        share: /volume1/k8snfs
        # Readable per-PVC folders on the NAS; $$ stops Flux substituting these
        subDir: $${pvc.metadata.namespace}-$${pvc.metadata.name}
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      mountOptions:
        - nfsvers=4.1
        - hard
        - noatime
