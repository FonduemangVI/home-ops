---
# Upstream publishes the chart only in-repo (no OCI/Helm repo or chart tags),
# so pull it straight from GitHub. The repo is ~1.1 GB of history: a pinned
# ref.commit forces a full clone and blows the timeout, so track main (shallow
# clone) and only check out the chart directory.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fluxer
spec:
  interval: 1h
  timeout: 5m
  url: https://github.com/fluxerapp/fluxer
  ref:
    branch: main
  sparseCheckout:
    - deploy/helm/fluxer
  ignore: |
    /*
    !/deploy/helm/fluxer/
