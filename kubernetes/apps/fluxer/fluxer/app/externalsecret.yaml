---
# Infisical: project "kubernetes", env prod, folder /fluxer. The single-pod
# chart has fluxerd create its own passwords and keys on first start and keep
# them on the data volume (and in its backups), so the only key supplied here
# is the one Fluxer cannot make: the Klipy GIF API key. Every key in this
# Secret becomes a setting via envFrom.
#
# The chart does not restart the pod when this Secret changes:
#   kubectl -n fluxer rollout restart statefulset/fluxer
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fluxer-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: fluxer-secret
  data:
    - secretKey: FLUXER_KLIPY_API_KEY
      remoteRef:
        key: /fluxer/FLUXER_KLIPY_API_KEY
