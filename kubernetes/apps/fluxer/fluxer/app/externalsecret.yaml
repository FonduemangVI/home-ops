---
# Infisical: project "kubernetes", env prod, folder /fluxer. Remote key names
# match the Docker stack's /fluxer folder so it can be copied across unchanged;
# secretKey is the name the chart expects. Every Fluxer pod loads the whole
# Secret via envFrom, so optional keys (Klipy) need no chart values.
# FLUXER_VALKEY_PASSWORD and FLUXER_NATS_AUTH_TOKEN are new (Docker ran both
# without auth). Constraints the chart enforces at render time:
#   - S3 access/secret key, Valkey password, NATS token: letters and digits only
#   - tokens/secrets/cookie, LiveKit secret, Valkey/NATS: at least 32 chars
#   - MEILI_MASTER_KEY: at least 16 chars
#   - FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64: standard base64, >= 32 bytes
#   - VAPID: unpadded base64url P-256 pair (87 / 43 chars)
# FLUXER_SETUP_TOKEN is left out on purpose: the API generates one on first
# start and logs it once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fluxer-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: fluxer-secret
  data:
    - secretKey: FLUXER_POSTGRES_PASSWORD
      remoteRef:
        key: /fluxer/POSTGRES_PASSWORD
    - secretKey: FLUXER_SEARCH_API_KEY
      remoteRef:
        key: /fluxer/MEILI_MASTER_KEY
    - secretKey: FLUXER_S3_ACCESS_KEY_ID
      remoteRef:
        key: /fluxer/FLUXER_S3_ACCESS_KEY
    - secretKey: FLUXER_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: /fluxer/FLUXER_S3_SECRET_KEY
    - secretKey: FLUXER_SUDO_MODE_SECRET
      remoteRef:
        key: /fluxer/FLUXER_SUDO_MODE_SECRET
    - secretKey: FLUXER_CONNECTION_INITIATION_SECRET
      remoteRef:
        key: /fluxer/FLUXER_CONNECTION_INITIATION_SECRET
    - secretKey: FLUXER_PROFILE_PSEUDONYM_SECRET
      remoteRef:
        key: /fluxer/FLUXER_PROFILE_PSEUDONYM_SECRET
    - secretKey: FLUXER_GATEWAY_RPC_AUTH_TOKEN
      remoteRef:
        key: /fluxer/FLUXER_GATEWAY_RPC_AUTH_TOKEN
    - secretKey: FLUXER_ERLANG_COOKIE
      remoteRef:
        key: /fluxer/FLUXER_ERLANG_COOKIE
    - secretKey: FLUXER_MEDIA_PROXY_SECRET_KEY
      remoteRef:
        key: /fluxer/FLUXER_MEDIA_PROXY_SECRET_KEY
    - secretKey: FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64
      remoteRef:
        key: /fluxer/FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64
    - secretKey: FLUXER_ADMIN_SECRET_KEY_BASE
      remoteRef:
        key: /fluxer/FLUXER_ADMIN_SECRET_KEY_BASE
    - secretKey: FLUXER_ADMIN_OAUTH_CLIENT_SECRET
      remoteRef:
        key: /fluxer/FLUXER_ADMIN_OAUTH_CLIENT_SECRET
    - secretKey: FLUXER_LIVEKIT_API_KEY
      remoteRef:
        key: /fluxer/LIVEKIT_API_KEY
    - secretKey: FLUXER_LIVEKIT_API_SECRET
      remoteRef:
        key: /fluxer/LIVEKIT_API_SECRET
    - secretKey: FLUXER_VAPID_PUBLIC_KEY
      remoteRef:
        key: /fluxer/FLUXER_VAPID_PUBLIC_KEY
    - secretKey: FLUXER_VAPID_PRIVATE_KEY
      remoteRef:
        key: /fluxer/FLUXER_VAPID_PRIVATE_KEY
    - secretKey: FLUXER_KLIPY_API_KEY
      remoteRef:
        key: /fluxer/FLUXER_KLIPY_API_KEY
    - secretKey: FLUXER_VALKEY_PASSWORD
      remoteRef:
        key: /fluxer/FLUXER_VALKEY_PASSWORD
    - secretKey: FLUXER_NATS_AUTH_TOKEN
      remoteRef:
        key: /fluxer/FLUXER_NATS_AUTH_TOKEN
