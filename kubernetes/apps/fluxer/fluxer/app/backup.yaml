---
# Nightly logical backup of the Fluxer database, as the operator docs advise
# (pg_dump --format=custom of postgres-0). A Synology snapshot of the live
# Postgres volume is not a consistent backup; this is. Restore needs the
# matching secrets, which live in Infisical (/fluxer). Uploads in SeaweedFS
# (data-seaweedfs-0) are not covered here.
#
# Restore, per the docs: scale everything but postgres to 0, then
#   pg_restore -h postgres -U fluxer -d fluxer --clean --if-exists <file>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-syno
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "30 3 * * *"
  timeZone: Australia/Melbourne
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            # The chart's NetworkPolicy only admits pods of this release to
            # postgres.
            app.kubernetes.io/instance: fluxer
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # Keep this on the same or a newer major than the server
              # (postgres.image.tag in helmrelease.yaml).
              image: docker.io/library/postgres:18.6-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  f="/backups/fluxer-$(date +%Y%m%d-%H%M%S).dump"
                  pg_dump -h postgres -U fluxer -d fluxer --format=custom -f "$f.partial"
                  mv "$f.partial" "$f"
                  echo "wrote $f ($(du -h "$f" | cut -f1))"
                  find /backups -name '*.partial' -delete
                  find /backups -name 'fluxer-*.dump' -mtime +"$RETENTION_DAYS" -print -delete
              env:
                - name: RETENTION_DAYS
                  value: "14"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fluxer-secret
                      key: FLUXER_POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backup
