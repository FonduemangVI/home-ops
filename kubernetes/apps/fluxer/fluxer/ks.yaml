---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluxer
spec:
  dependsOn:
    - name: infisical
      namespace: external-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: fluxer
      namespace: fluxer
  interval: 1h
  path: ./kubernetes/apps/fluxer/fluxer/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: fluxer
  timeout: 15m
  wait: false
