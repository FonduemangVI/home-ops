---
# Self-hosted Infisical on vgrc-apps-01 (via Traefik). Kubernetes Auth: ESO
# presents its own ServiceAccount token, Infisical validates it with the
# cluster's TokenReview API using that same token (no reviewer JWT), so no
# credential is stored anywhere. Identity: project-level, Viewer role.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://secrets-mgr.vaultlabs1226.com
      auth:
        kubernetesAuthCredentials:
          identityId:
            name: infisical-kubernetes-auth
            namespace: external-secrets
            key: identityId
      secretsScope:
        projectSlug: kubernetes
        environmentSlug: prod
