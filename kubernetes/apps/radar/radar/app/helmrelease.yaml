---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  chart:
    spec:
      chart: radar
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: skyhook
  interval: 1h
  values:
    auth:
      mode: oidc
      existingSecret: radar-secret
      existingSecretKey: auth-secret
      oidc:
        issuerURL: https://authentik.vaultlabs1226.com/application/o/radar/
        clientID: RUOHU5SUumyhBhejT3zOYHVFeka5ohvTpVFVV9Cx
        existingSecret: radar-secret
        clientSecretKey: client-secret
        redirectURL: https://radar.k8s.vaultlabs1226.com/auth/callback
        postLogoutRedirectURL: https://radar.k8s.vaultlabs1226.com/
        usernamePrefix: "authentik:"
        groupsPrefix: "authentik:"
        enablePKCE: true
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - radar.k8s.vaultlabs1226.com
    rbac:
      podExec: true
      portForward: true
      secrets: true
    podAnnotations:
      secret.reloader.stakater.com/reload: radar-secret
