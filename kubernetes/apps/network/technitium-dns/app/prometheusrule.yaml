---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: technitium-dns-rules
spec:
  groups:
    - name: technitium-dns.rules
      rules:
        - alert: ExternalDNSStale
          expr: |-
            time() - external_dns_controller_last_sync_timestamp_seconds{job="technitium-dns"} > 60
          for: 5m
          annotations:
            summary: >-
              ExternalDNS ({{ $labels.job }}) has not synced successfully in the last five minutes
          labels:
            severity: critical
